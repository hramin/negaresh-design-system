name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, tokens, unit tests, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Tokens (DTCG validation + contrast)
        run: pnpm tokens:check
      - run: pnpm typecheck
      - name: Lint (Biome + stylelint — logical properties, no raw colours)
        run: pnpm lint
      - name: Unit tests (utils coverage ≥ 95 %, contrast fails on a broken pair)
        run: pnpm test
      - run: pnpm build

      - name: Install Chromium for Playwright
        working-directory: apps/docs
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E (SSR smoke + axe on every docs route, light/dark, 1440/390)
        run: pnpm test:e2e
        env:
          CI: true
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/docs/playwright-report
          retention-days: 14
