name: CI

on:
  pull_request:
  push:
    branches: [main, nds-development]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, tokens, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Tokens (DTCG validation + contrast)
        run: pnpm tokens:check
      - run: pnpm typecheck
      - name: Lint (Biome + stylelint — logical properties, no raw colours)
        run: pnpm lint
      - name: Unit tests (utils coverage ≥ 95 %, components incl. axe and SSR)
        run: pnpm test
      - run: pnpm build

  e2e:
    name: E2E — smoke, axe, reference parity, visual snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Same image as the committed baselines (apps/docs/e2e/__screenshots__): fonts and
    # rasterisation must match for the 0.1 % visual gate (docs/quality.md).
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
    env:
      NDS_VISUAL: "1"
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Playwright (browsers come with the image)
        run: pnpm test:e2e
        env:
          CI: true
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/docs/playwright-report
            apps/docs/test-results
          retention-days: 14

  keycloak-jar:
    name: Keycloak theme JAR packaging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-keycloakify-${{ hashFiles('packages/keycloak-theme/package.json') }}
          restore-keys: |
            ${{ runner.os }}-m2-keycloakify-
      - run: pnpm install --frozen-lockfile
      - name: Build workspace dependencies and package Keycloak 26+ JAR
        run: |
          pnpm --filter @negaresh/keycloak-theme^... build
          pnpm --filter @negaresh/keycloak-theme build:jar
      - name: Upload Keycloak theme JAR
        uses: actions/upload-artifact@v7
        with:
          name: negaresh-keycloak-theme-jar
          path: packages/keycloak-theme/dist_keycloak/*.jar
          retention-days: 14

